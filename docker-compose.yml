services:
  chatbot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-chatbot
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-all-MiniLM-L6-v2}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-pro}
      - CHROMA_DB_PATH=/app/chroma_db
      - COLLECTION_NAME=${COLLECTION_NAME:-ecommerce_faq}
      - DATASET_PATH=/app/data/Ecommerce_FAQ_Chatbot_dataset.csv
      - TOP_K=${TOP_K:-5}
    volumes:
      - chroma_data:/app/chroma_db
      - ./data:/app/data:ro

    restart: unless-stopped

    healthcheck:
      test: [ "CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/')" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  chroma_data:
    driver: local
